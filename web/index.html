<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callback — AP Hold Queue</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="brand">
    <h1>Callback</h1>
    <span class="tag">Accounts Payable — Hold Queue</span>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="queue">Hold queue</button>
    <button class="tab" data-view="vendors">Vendors</button>
    <button class="tab" data-view="engine">Under the hood</button>
  </nav>
  <div class="right">
    <span id="status" class="status"></span>
    <button id="reset" class="ghost">Reset demo</button>
  </div>
</header>

<div id="mailbar" class="mailbar" hidden></div>

<main id="view-queue">
  <section id="queue" class="queue">
    <h2>Held payments <span id="count" class="count"></span></h2>
    <div id="holds"></div>
    <div id="cleared" class="cleared"></div>
  </section>

  <section id="detail" class="detail">
    <div class="empty">Select a held payment to see why it was stopped.</div>
  </section>
</main>

<div id="view-vendors" class="engine" hidden></div>
<div id="view-engine" class="engine" hidden></div>

<script src="app.js"></script>
</body>
</html>
